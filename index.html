
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 지하철역 검색 지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            background: #ffffff;
            border-right: 1px solid #dddddd;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            z-index: 1;
        }

        h1 {
            font-size: 23px;
            margin: 0;
            color: #222222;
        }

        .description {
            font-size: 13px;
            color: #777777;
            margin: 0;
            line-height: 1.6;
        }

        .search-area {
            display: flex;
            gap: 8px;
        }

        #keyword {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            color: #222222;
            font-weight: bold;
            cursor: pointer;
        }

        #showStationsButton {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #e6f2ff;
            color: #174c83;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            font-size: 13px;
            color: #555555;
            line-height: 1.6;
            min-height: 20px;
            margin: 0;
        }

        #resultList,
        #stationList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item,
        .station-item {
            padding: 12px;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
        }

        .result-item:hover,
        .station-item:hover {
            background: #e6f2ff;
            border-color: #9bcaff;
        }

        .place-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #222222;
        }

        .place-address {
            font-size: 12px;
            line-height: 1.5;
            color: #666666;
        }

        .station-item {
            font-size: 14px;
        }

        #map {
            flex: 1;
            height: 100%;
            min-width: 0;
            background: #eeeeee;
        }

        @media (max-width: 650px) {
            body {
                overflow: auto;
            }

            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 45vh;
                min-height: 300px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            #map {
                flex: none;
                width: 100%;
                height: 55vh;
                min-height: 350px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <h1>전국 지하철역 검색</h1>

            <p class="description">
                지하철역 이름을 입력하세요.
                검색어와 이름이 일치하는 역만 표시합니다.
            </p>

            <div class="search-area">
                <input
                    type="text"
                    id="keyword"
                    placeholder="예: 서울역"
                    aria-label="검색할 지하철역 이름"
                >

                <button id="searchButton" type="button">
                    검색
                </button>
            </div>

            <p id="message" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <div id="resultList"></div>

            <button id="showStationsButton" type="button">
                예시 역 목록 표시하기
            </button>

            <p class="description">
                아래 예시 역 목록은 일부 역만 포함하며,
                전국의 모든 역을 나타내지는 않습니다.
            </p>

            <div id="stationList"></div>
        </aside>

        <div id="map" aria-label="카카오맵 지도"></div>
    </div>

    <!-- 카카오맵 JavaScript SDK -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=27abdc4fa3410f4761c896b62291f606&libraries=services&autoload=false"
        onerror="document.getElementById('message').textContent='지도를 불러오지 못했습니다. API 키와 도메인 설정을 확인하세요.'">
    </script>

    <script>
        // 지도와 검색 기능에 사용할 변수
        let map;
        let placesService;
        let markers = [];
        let infoWindow;

        // 예시 역 목록의 마커를 저장하는 변수
        let subwayMarkers = [];
        let stationsVisible = false;

        // HTML 요소 가져오기
        const keywordInput = document.getElementById("keyword");
        const searchButton = document.getElementById("searchButton");
        const resultList = document.getElementById("resultList");
        const stationList = document.getElementById("stationList");
        const message = document.getElementById("message");
        const showStationsButton =
            document.getElementById("showStationsButton");

        // 예시 지하철역 데이터
        // 전국 전체 역 데이터가 아닌 일부 예시입니다.
        const subwayStations = [
            {
                name: "서울역",
                line: "1호선·4호선",
                lat: 37.5547,
                lng: 126.9707
            },
            {
                name: "시청역",
                line: "1호선·2호선",
                lat: 37.5636,
                lng: 126.9751
            },
            {
                name: "종각역",
                line: "1호선",
                lat: 37.5702,
                lng: 126.9831
            },
            {
                name: "종로3가역",
                line: "1호선·3호선·5호선",
                lat: 37.5710,
                lng: 126.9918
            },
            {
                name: "동대문역",
                line: "1호선·4호선",
                lat: 37.5714,
                lng: 127.0097
            },
            {
                name: "명동역",
                line: "4호선",
                lat: 37.5609,
                lng: 126.9860
            },
            {
                name: "충무로역",
                line: "3호선·4호선",
                lat: 37.5612,
                lng: 126.9942
            },
            {
                name: "을지로입구역",
                line: "2호선",
                lat: 37.5660,
                lng: 126.9826
            },
            {
                name: "강남역",
                line: "2호선·신분당선",
                lat: 37.4979,
                lng: 127.0276
            },
            {
                name: "홍대입구역",
                line: "2호선·경의중앙선·공항철도",
                lat: 37.5572,
                lng: 126.9254
            },
            {
                name: "신촌역",
                line: "2호선",
                lat: 37.5551,
                lng: 126.9368
            },
            {
                name: "잠실역",
                line: "2호선·8호선",
                lat: 37.5133,
                lng: 127.1001
            },
            {
                name: "건대입구역",
                line: "2호선·7호선",
                lat: 37.5404,
                lng: 127.0692
            },
            {
                name: "부산역",
                line: "부산 1호선",
                lat: 35.1152,
                lng: 129.0415
            },
            {
                name: "서면역",
                line: "부산 1호선·2호선",
                lat: 35.1577,
                lng: 129.0593
            },
            {
                name: "대전역",
                line: "대전 1호선",
                lat: 36.3325,
                lng: 127.4348
            }
        ];

        // 페이지가 준비되면 카카오맵 실행
        window.addEventListener("load", function () {
            if (!window.kakao || !window.kakao.maps) {
                message.textContent =
                    "카카오맵을 불러오지 못했습니다. API 키와 도메인 설정을 확인하세요.";
                return;
            }

            // SDK 준비가 완료된 뒤 지도 초기화
            kakao.maps.load(function () {
                initializeMap();
            });
        });

        // 지도와 검색 서비스 초기화
        function initializeMap() {
            const defaultPosition =
                new kakao.maps.LatLng(37.5665, 126.9780);

            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            placesService = new kakao.maps.services.Places();

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 1
            });

            message.textContent =
                "지도가 준비되었습니다. 역 이름을 검색하세요.";

            // 검색 버튼과 Enter 키 연결
            searchButton.addEventListener("click", searchPlaces);

            keywordInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    searchPlaces();
                }
            });

            // 현재 위치 확인
            getCurrentLocation();
        }

        // 현재 위치를 지도에 표시
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setCenter(currentPosition);

                    const currentMarker = new kakao.maps.Marker({
                        position: currentPosition,
                        map: map,
                        title: "현재 위치"
                    });

                    markers.push(currentMarker);
                },
                function () {
                    // 위치 권한이 없어도 역 검색은 계속 사용할 수 있습니다.
                    console.log("현재 위치를 가져오지 못했습니다.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 검색어에서 공백을 제거
        function normalizeName(name) {
            return String(name).replace(/\s/g, "");
        }

        // 입력한 역 이름 검색
        function searchPlaces() {
            const keyword = keywordInput.value.trim();

            if (keyword === "") {
                message.textContent = "검색할 역 이름을 입력하세요.";
                keywordInput.focus();
                return;
            }

            if (!map || !placesService) {
                message.textContent =
                    "지도가 아직 준비되지 않았습니다.";
                return;
            }

            // 이전 검색 결과와 마커 삭제
            resultList.replaceChildren();
            removeMarkers();

            message.textContent = "지하철역을 검색하고 있습니다.";

            // 검색어를 포함한 장소를 검색하되,
            // 결과를 받은 뒤 역 카테고리와 이름을 다시 확인합니다.
            placesService.keywordSearch(
                keyword,
                function (data, status) {
                    if (status !== kakao.maps.services.Status.OK) {
                        resultList.replaceChildren();
                        message.textContent =
                            "일치하는 지하철역을 찾지 못했습니다. 역 이름을 확인하세요.";
                        return;
                    }

                    const searchName = normalizeName(keyword);

                    // 핵심: 역 카테고리이면서 이름이 정확히 일치하는 결과만 남김
                  const stationResults = data.filter(function (place) {
    // 장소 이름에서 공백 제거
  
const stationResults = data.filter(function (place) {
    const placeName = normalizeName(place.place_name);

    return (
        place.category_group_code === "SW8" &&
        placeName.includes(searchName)
    );
});

                    // 필터링된 결과만 한 번 표시
                    if (stationResults.length === 0) {
                        resultList.replaceChildren();
                        message.textContent =
                            "이름이 정확히 일치하는 지하철역이 없습니다.";
                        return;
                    }

                    displayResults(stationResults);
                },
                {
                    category_group_code: "SW8"
                }
            );
        }

        // 검색된 역을 목록과 지도에 표시
        function displayResults(places) {
            resultList.replaceChildren();
            message.textContent =
                "일치하는 지하철역 " + places.length + "개를 찾았습니다.";

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name
                });

                markers.push(marker);
                bounds.extend(position);

                const resultItem = document.createElement("button");
                resultItem.type = "button";
                resultItem.className = "result-item";

                const placeName = document.createElement("div");
                placeName.className = "place-name";
                placeName.textContent = place.place_name;

                const placeAddress = document.createElement("div");
                placeAddress.className = "place-address";
                placeAddress.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                resultItem.appendChild(placeName);
                resultItem.appendChild(placeAddress);
                resultList.appendChild(resultItem);

                // 목록이나 마커를 누르면 해당 역으로 이동
                resultItem.addEventListener("click", function () {
                    selectPlace(place, marker);
                });

                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        selectPlace(place, marker);
                    }
                );
            });

            map.setBounds(bounds);
        }

        // 선택한 역의 위치와 이름 표시
        function selectPlace(place, marker) {
            const position = new kakao.maps.LatLng(
                place.y,
                place.x
            );

            map.setLevel(5);
            map.setCenter(position);

            infoWindow.setContent(
                '<div style="padding:8px;font-size:13px;">' +
                escapeHTML(place.place_name) +
                "</div>"
            );

            infoWindow.open(map, marker);
        }

        // HTML에 표시할 문자열의 특수문자 처리
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function (character) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[character];
            });
        }

        // 검색 결과 마커 삭제
        function removeMarkers() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 예시 역 목록 표시 또는 숨기기
        showStationsButton.addEventListener("click", function () {
            if (!map) {
                message.textContent = "지도가 아직 준비되지 않았습니다.";
                return;
            }

            if (stationsVisible) {
                subwayMarkers.forEach(function (marker) {
                    marker.setMap(null);
                });

                subwayMarkers = [];
                stationList.replaceChildren();
                stationsVisible = false;

                this.textContent = "예시 역 목록 표시하기";
                message.textContent = "예시 역 목록을 숨겼습니다.";
                return;
            }

            displaySubwayStations();

            stationsVisible = true;
            this.textContent = "예시 역 목록 숨기기";
            message.textContent =
                "등록된 예시 역 " + subwayStations.length + "개를 표시했습니다.";
        });

        // 예시 역을 지도와 목록에 표시
        function displaySubwayStations() {
            stationList.replaceChildren();
            subwayMarkers = [];

            subwayStations.forEach(function (station) {
                const position = new kakao.maps.LatLng(
                    station.lat,
                    station.lng
                );

                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: station.name
                });

                subwayMarkers.push(marker);

                const stationItem = document.createElement("button");
                stationItem.type = "button";
                stationItem.className = "station-item";
                stationItem.textContent =
                    station.name + " · " + station.line;

                stationList.appendChild(stationItem);

                stationItem.addEventListener("click", function () {
                    moveToStation(station, marker);
                });

                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        moveToStation(station, marker);
                    }
                );
            });
        }

        // 예시 역을 선택했을 때 지도 이동 및 노선 표시
        function moveToStation(station, marker) {
            const position = new kakao.maps.LatLng(
                station.lat,
                station.lng
            );

            map.setLevel(5);
            map.setCenter(position);

            infoWindow.setContent(
                '<div style="padding:10px;font-size:13px;line-height:1.6;">' +
                "<strong>" + escapeHTML(station.name) + "</strong><br>" +
                escapeHTML(station.line) +
                "</div>"
            );

            infoWindow.open(map, marker);
        }
    </script>
</body>
</html>

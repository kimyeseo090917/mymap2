
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 지하철역 검색 지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            background: #ffffff;
            border-right: 1px solid #dddddd;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            z-index: 1;
        }

        h1 {
            font-size: 23px;
            margin: 0;
            color: #222222;
        }

        .description {
            font-size: 13px;
            color: #777777;
            margin: 0;
            line-height: 1.6;
        }

        /* 검색창과 검색 버튼 */
        .search-area {
            display: flex;
            gap: 8px;
        }

        #keyword {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            color: #222222;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #f3d900;
        }

        /* 검색 상태 메시지 */
        #message {
            font-size: 13px;
            color: #555555;
            line-height: 1.6;
            min-height: 20px;
            margin: 0;
        }

        /* 검색 결과 목록 */
        #resultList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            padding: 12px;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .result-item:hover {
            background: #e6f2ff;
            border-color: #9bcaff;
        }

        .place-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #222222;
        }

        .place-address {
            font-size: 12px;
            line-height: 1.5;
            color: #666666;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            height: 100%;
            min-width: 0;
            background: #eeeeee;
        }

        /* 작은 화면에서는 위아래로 배치 */
        @media (max-width: 650px) {
            body {
                overflow: auto;
            }

            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 45vh;
                min-height: 300px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            #map {
                flex: none;
                width: 100%;
                height: 55vh;
                min-height: 350px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색 영역 -->
        <aside class="sidebar">
            <h1>전국 지하철역 검색</h1>

            <p class="description">
                지하철역 이름을 입력하세요.
                검색어가 포함된 지하철역만 표시합니다.
            </p>

            <div class="search-area">
                <input
                    type="text"
                    id="keyword"
                    placeholder="예: 서울역"
                    aria-label="검색할 지하철역 이름"
                >

                <button id="searchButton" type="button">
                    검색
                </button>
            </div>

            <p id="message" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽 지도 -->
        <div id="map" aria-label="카카오맵 지도"></div>
    </div>

    <!-- 카카오맵 API -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=27abdc4fa3410f4761c896b62291f606&libraries=services&autoload=false"
        onerror="document.getElementById('message').textContent='지도를 불러오지 못했습니다. API 키와 도메인 설정을 확인하세요.'">
    </script>

    <script>
        // 지도와 검색 기능에 필요한 변수
        let map;
        let placesService;
        let markers = [];
        let infoWindow;
        let searchNumber = 0;

        // HTML 요소 가져오기
        const keywordInput = document.getElementById("keyword");
        const searchButton = document.getElementById("searchButton");
        const resultList = document.getElementById("resultList");
        const message = document.getElementById("message");

        // 카카오맵 API가 준비되면 지도 실행
        window.addEventListener("load", function () {
            if (!window.kakao || !window.kakao.maps) {
                message.textContent =
                    "지도를 불러오지 못했습니다. API 키와 도메인 설정을 확인하세요.";
                return;
            }

            kakao.maps.load(function () {
                initializeMap();
            });
        });

        // 지도 초기화
        function initializeMap() {
            const defaultPosition =
                new kakao.maps.LatLng(37.5665, 126.9780);

            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            // 카카오 장소 검색 서비스
            placesService = new kakao.maps.services.Places();

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 1
            });

            message.textContent =
                "역 이름을 입력하고 검색하세요.";

            // 검색 버튼 클릭
            searchButton.addEventListener("click", searchPlaces);

            // Enter 키로도 검색
            keywordInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    searchPlaces();
                }
            });
        }

        // 역 이름의 공백을 제거해 비교하기 쉽게 만듦
        function normalizeName(name) {
            return String(name).replace(/\s/g, "");
        }

        // 검색 결과와 마커 초기화
        function clearSearchResults() {
            resultList.replaceChildren();

            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 입력한 이름이 포함된 지하철역 검색
        function searchPlaces() {
            const keyword = keywordInput.value.trim();

            if (keyword === "") {
                message.textContent =
                    "검색할 지하철역 이름을 입력하세요.";
                keywordInput.focus();
                return;
            }

            if (!map || !placesService) {
                message.textContent =
                    "지도가 아직 준비되지 않았습니다.";
                return;
            }

            // 검색할 때마다 이전 검색 결과를 모두 제거
            clearSearchResults();

            // 연속 검색 시 이전 검색 결과가 나중에 도착하는 문제 방지
            const thisSearchNumber = ++searchNumber;

            const searchName = normalizeName(keyword);

            message.textContent =
                "'" + keyword + "' 지하철역을 검색하고 있습니다.";

            // 카카오맵에서 지하철역 카테고리로 검색
            placesService.keywordSearch(
                keyword,
                function (data, status) {
                    // 더 최근 검색이 시작되었다면 이전 결과는 무시
                    if (thisSearchNumber !== searchNumber) {
                        return;
                    }

                    // 검색 결과가 없으면 빈 목록 유지
                    if (status !== kakao.maps.services.Status.OK) {
                        clearSearchResults();
                        message.textContent =
                            "일치하는 지하철역이 없습니다.";
                        return;
                    }

                    // 지하철역 카테고리이면서 이름에 검색어가 포함된 결과만 선택
                   const stationResults = data.filter(function (place) {
    const placeName = normalizeName(place.place_name);

    // 검색어가 역 이름에 포함되어 있는지 확인
    const includesKeyword = placeName.includes(searchName);

    // 지하철역 카테고리인지 확인
    const isSubwayStation =
        place.category_group_code === "SW8";

    // 건물이나 아파트 이름은 제외
    const isBuilding =
        placeName.includes("빌딩") ||
        placeName.includes("아파트") ||
        placeName.includes("오피스텔");

    return (
        isSubwayStation &&
        includesKeyword &&
        !isBuilding
    );
});

                    // 조건에 맞는 역이 없으면 다른 장소를 대신 표시하지 않음
                    if (stationResults.length === 0) {
                        clearSearchResults();
                        message.textContent =
                            "검색어가 포함된 지하철역을 찾지 못했습니다.";
                        return;
                    }

                    // 필터링한 지하철역만 표시
                    displayResults(stationResults);
                },
                {
                    category_group_code: "SW8"
                }
            );
        }

        // 검색된 역만 목록과 지도에 표시
        function displayResults(places) {
            resultList.replaceChildren();

            message.textContent =
                "검색된 지하철역: " + places.length + "개";

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 해당 역의 지도 마커 생성
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name
                });

                markers.push(marker);
                bounds.extend(position);

                // 검색 결과 목록 항목 생성
                const resultItem = document.createElement("button");
                resultItem.type = "button";
                resultItem.className = "result-item";

                const placeName = document.createElement("div");
                placeName.className = "place-name";
                placeName.textContent = place.place_name;

                const placeAddress = document.createElement("div");
                placeAddress.className = "place-address";
                placeAddress.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                resultItem.appendChild(placeName);
                resultItem.appendChild(placeAddress);
                resultList.appendChild(resultItem);

                // 목록을 누르면 선택한 역으로 이동
                resultItem.addEventListener("click", function () {
                    selectPlace(place, marker);
                });

                // 지도 마커를 누르면 역 이름 표시
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        selectPlace(place, marker);
                    }
                );
            });

            // 검색된 역의 위치에 맞게 지도 이동
            if (places.length === 1) {
                map.setLevel(5);
                map.setCenter(
                    new kakao.maps.LatLng(places[0].y, places[0].x)
                );
            } else {
                map.setBounds(bounds);
            }
        }

        // 선택한 역의 위치와 이름 표시
        function selectPlace(place, marker) {
            const position = new kakao.maps.LatLng(
                place.y,
                place.x
            );

            map.setLevel(5);
            map.setCenter(position);

            const content = document.createElement("div");
            content.style.padding = "8px";
            content.style.fontSize = "13px";
            content.textContent = place.place_name;

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }
    </script>
</body>
</html>
